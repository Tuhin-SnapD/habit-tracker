<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LevelUp — a local-first habit tracker that turns daily routines into a visual, gamified system. No accounts, no server." />
    <meta name="theme-color" content="#FDE7DB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F1B2D" media="(prefers-color-scheme: dark)" />
    <title>LevelUp Habit Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&display=swap"
      rel="stylesheet"
    />
    <!-- Prevent dark mode flash -->
    <script>
      try {
        const d = JSON.parse(localStorage.getItem('levelup.v1') || '{}');
        if (d?.state?.settings?.theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-[500] focus:px-4 focus:py-2 focus:bg-accent-purple focus:text-white focus:rounded-lg focus:text-sm focus:font-medium">
      Skip to content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
